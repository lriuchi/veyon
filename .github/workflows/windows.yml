
name: Build Veyon Windows x64

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Veyon
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Download Windows build environment
        run: |
          docker pull registry.gitlab.com/veyon/ci-mingw-w64:main

      - name: Build Veyon Windows x64
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/src" \
            -w /src \
            registry.gitlab.com/veyon/ci-mingw-w64:main \
            bash -lc "git config --global --add safe.directory /src && .ci/windows/build.sh x86_64"

      - name: Upload Windows binaries
        uses: actions/upload-artifact@v4
        with:
          name: veyon-windows-x64
          path: veyon-win*
          if-no-files-found: error
